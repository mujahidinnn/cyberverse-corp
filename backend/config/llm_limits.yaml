# Limit free tier per model, ~10% di bawah limit resmi. Diverifikasi 2026-09-30 dari header rate-limit
# (Groq, Mistral) atau dibuat konservatif bila provider tidak mengirim header (Gemini, OpenRouter).
# Provider tanpa env key / OLLAMA_HOST otomatis dilewati router.
providers:
  groq/qwen/qwen3.8-27b:                         {rpm: 27, rpd: 900,  tpm: 7200,   tpd: null, concurrency: 3}
  gemini/gemini-3.5-flash-lite:                  {rpm: 10, rpd: 900,  tpm: 200000, tpd: null, concurrency: 3}
  mistral/ministral-14b-latest:                  {rpm: 50, rpd: null, tpm: 400000, tpd: null, concurrency: 2}
  "openrouter/nvidia/nemotron-3-super-120b-a12b:free": {rpm: 18, rpd: 45, tpm: null,  tpd: null, concurrency: 1}
  ollama/qwen2.5-coder:7b:                       {rpm: null, rpd: null, tpm: null, tpd: null, concurrency: 1}
  ollama/llama3.2:3b:                            {rpm: null, rpd: null, tpm: null, tpd: null, concurrency: 1}
ollama_global_concurrency: 1

# Rantai failover per tier (urut prioritas). Hanya model yang lolos uji tool-calling + structured output
# CrewAI (2026-09-30). Tidak dipakai: gpt-oss-* (salah memanggil tool), codestral (tidak memanggil tool),
# Cerebras (butuh billing), mistral-small/medium (limit 0 di plan gratis), Gemini 2.5 (ditutup untuk user baru).
tiers:
  T1_REASON:      [groq/qwen/qwen3.8-27b, gemini/gemini-3.5-flash-lite, "openrouter/nvidia/nemotron-3-super-120b-a12b:free", mistral/ministral-14b-latest]
  T2_FAST:        [mistral/ministral-14b-latest, groq/qwen/qwen3.8-27b, gemini/gemini-3.5-flash-lite]
  T3_DOC:         [gemini/gemini-3.5-flash-lite, mistral/ministral-14b-latest, groq/qwen/qwen3.8-27b]
  T4_LOCAL_CODE:  [ollama/qwen2.5-coder:7b, groq/qwen/qwen3.8-27b, mistral/ministral-14b-latest, gemini/gemini-3.5-flash-lite]
  T5_LOCAL_LIGHT: [ollama/llama3.2:3b, mistral/ministral-14b-latest, gemini/gemini-3.5-flash-lite]
